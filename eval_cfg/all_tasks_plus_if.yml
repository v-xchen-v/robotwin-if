# Do not curate a second IF inventory here; tests/test_task_manifests.py enforces the
# relationship between both files.
#
# Format: a plain `tasks:` list. Native tasks live in the submodule; IF tasks resolve
# after scripts/bridge_tasks.sh symlinks them into the RoboTwin runtime.
#
# This locked RoboTwin commit has no native multitask runner. To collect the whole list,
# loop over the raw single-task entry point:
#
#   bash scripts/bridge_tasks.sh
#   cd third_party/robotwin
#   for t in $(python3 -c "import yaml;print(' '.join(yaml.safe_load(open('../../eval_cfg/all_tasks_plus_if.yml'))['tasks']))"); do
#     bash collect_data.sh "$t" demo_clean 0   # <task> <config> <gpu_id>
#   done
#
# Eval is likewise per-(policy, task), through each policy's own eval.sh. Native eval's
# seed-skipping loop is suitable for smoke tests only; formal IF results need a fixed,
# group-balanced seed manifest and per-mode reporting (see eval_cfg/README.md).

