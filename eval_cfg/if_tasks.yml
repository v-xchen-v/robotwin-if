# RoboTwin-IF · canonical maintained IF task suite
#
# This is the sole machine-readable inventory of maintained IF tasks. The order follows
# the seven diagnostic axes documented in notes/2026-09-01-if-ext-tasklist/tasks.html.
# Other task envs may remain in tasks/envs/ for provenance or experimentation; an env is
# active only when it appears in this list.
#
# Format: a plain `tasks:` list. Each name must resolve to envs/<name>.py after
# `scripts/bridge_tasks.sh` symlinks tasks/envs/*.py into the RoboTwin runtime.
#
# Membership and production readiness are separate. In particular, pick_diverse_object
# is a maintained Noun-Grounding task whose locked production pools remain independently
# enforced by tests/pick_diverse_object/test_pool.py.
#
# Usage — RoboTwin collect/eval entry points are single-task, so loop over this list:
#
#   bash scripts/bridge_tasks.sh
#   cd third_party/robotwin
#   for t in $(python3 -c "import yaml;print(' '.join(yaml.safe_load(open('../../eval_cfg/if_tasks.yml'))['tasks']))"); do
#     bash collect_data.sh "$t" demo_clean 0   # <task> <config> <gpu_id>
#   done
#
# See eval_cfg/README.md for axis mapping, readiness semantics, and eval caveats.

tasks:
  - bottle_verb
  - pick_diverse_object
  - attribute_select
  - arm_select
  - stack_sequence
  - place_relative
  - grasp_cube_approach
